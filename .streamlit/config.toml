[server]
headless = true
enableCORS = false
enableXsrfProtection = false
address = "0.0.0.0"
port = 8501

[client]
# SkyGuard routes its dashboard modules through components/sidebar.py.  Do not
# let Streamlit also turn dashboard/pages into an automatic multipage menu.
showSidebarNavigation = false

[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
font = "sans serif"

[browser]
gatherUsageStats = false
